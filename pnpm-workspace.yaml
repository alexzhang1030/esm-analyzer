minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustLockfile: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver

dangerouslyAllowAllBuilds: true
shellEmulator: true

packages:
  - .

overrides:
  esbuild: ^0.28.2

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver
  - '@swc/core'
